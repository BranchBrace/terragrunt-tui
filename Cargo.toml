[package]
name = "terragrunt-tui"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
description = "Local read-only Terragrunt plan aggregator CLI and TUI"

default-run = "terragrunt-tui"

[[bin]]
name = "terragrunt-tui"
path = "src/main.rs"

[[bin]]
name = "ttui"
path = "src/bin/ttui.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
